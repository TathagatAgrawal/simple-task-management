name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is where the firm runs it; macOS is where it's developed.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  web:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Regenerate API types
        run: npm run types
        working-directory: web
      - name: Type-check, test and build
        run: |
          npm run typecheck
          npm test
          npm run build
        working-directory: web
      - name: Committed types and bundle are up to date
        run: |
          git diff --exit-code -- web/src/api/schema.d.ts src/simple_task_management/static/dist \
            || (echo "::error::Run 'npm --prefix web run types' and 'npm --prefix web run build', then commit the result." && exit 1)

  powershell:
    name: Check Windows scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse every deploy script
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem deploy/windows -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" } }
            else { Write-Host "OK  $($_.Name)" }
          }
          if ($failed) { exit 1 }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path deploy/windows -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

  shell:
    name: Check Linux scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse every deploy script
        run: for f in deploy/linux/*.sh; do bash -n "$f" && echo "OK  $f"; done
      - name: ShellCheck
        run: shellcheck -x -S warning deploy/linux/*.sh
