<h2>People</h2>
{% if flash %}<p class="flash">{{ flash }}</p>{% endif %}
<ul class="people">
  {% for p in people %}
  <li>
    <span class="avatar tone-{{ p.id | avatar_tone }}">{{ p.name | initials }}</span>
    <span class="grow">{{ p.name }} <span class="muted small">@{{ p.username }}</span>
      {% if p.is_admin %}<span class="chip">admin</span>{% endif %}</span>
    <button type="button" class="btn small" hx-post="/people/{{ p.id }}/reset" hx-target="#people"
            hx-confirm="Give {{ p.name }} a new temporary password? They'll be signed out.">Reset password</button>
    {% if p.id != me.id %}
    <button type="button" class="btn small" hx-post="/people/{{ p.id }}/admin" hx-target="#people"
            hx-vals='{"make_admin": {{ 0 if p.is_admin else 1 }}}'>{{ "Remove admin" if p.is_admin else "Make admin" }}</button>
    <button type="button" class="btn small danger" hx-post="/people/{{ p.id }}/remove" hx-target="#people"
            hx-confirm="Remove {{ p.name }}? They won't be able to sign in, and they'll be taken off their open tasks. Their past updates stay.">Remove</button>
    {% endif %}
  </li>
  {% endfor %}
</ul>
<form class="row" hx-post="/people" hx-target="#people">
  <input name="name" placeholder="Full name" required maxlength="60">
  <input name="username" placeholder="Username, e.g. meera" required maxlength="32" pattern="[a-zA-Z0-9._\-]{2,32}">
  <button class="btn primary" type="submit">Add person</button>
</form>
