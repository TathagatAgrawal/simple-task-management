<article class="card" draggable="true" data-task-id="{{ card.id }}" tabindex="0"
         hx-get="/tasks/{{ card.id }}" hx-target="#panel" hx-swap="innerHTML" hx-trigger="click, keyup[key=='Enter']">
  <div class="card-title">{{ card.title }}</div>
  <div class="card-meta">
    <span class="chips">
      <span class="chip {{ card.due_tone }}">{{ card.due_label }}</span>
      {% if card.repeat != "none" %}<span class="chip blue">🔁 {{ card.repeat_label }}</span>{% endif %}
    </span>
    <span class="card-right">
      {% if card.comments %}<span class="muted small" title="{{ card.comments }} comment(s)">💬 {{ card.comments }}</span>{% endif %}
      <span class="avatars">
        {% for p in card.assignees %}<span class="avatar tone-{{ p.id | avatar_tone }}" title="{{ p.name }}">{{ p.name | initials }}</span>{% endfor %}
        {% if not card.assignees %}<span class="muted small">Unassigned</span>{% endif %}
      </span>
    </span>
  </div>
</article>
