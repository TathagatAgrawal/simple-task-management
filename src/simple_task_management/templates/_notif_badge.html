{# The bell. Swapped in place every few seconds; data-* tells board.js when something new arrived. #}
{% from "_icons.html" import icon %}
<span id="bell-badge" class="bell-wrap" data-unread="{{ unread }}" data-newest="{{ newest }}" data-user="{{ user.id }}"
      hx-get="/notifications/badge" hx-swap="outerHTML"
      hx-trigger="notifications-changed from:body, tasks-changed from:body, every 20s, focus from:window, visibilitychange[document.visibilityState=='visible'] from:document">
  <button id="bell-btn" type="button" class="bell" popovertarget="notif-panel"
          aria-label="Notifications{% if unread %}, {{ unread }} unread{% endif %}">
    {{ icon("bell", 20) }}{% if unread %}<span class="nbadge" aria-hidden="true">{{ unread if unread < 10 else "9+" }}</span>{% endif %}
  </button>
</span>
